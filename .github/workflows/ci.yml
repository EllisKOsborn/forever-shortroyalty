name: Tests

on:
  push:
  pull_request:

# Read-only token: the tests never need to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4
      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck
      - name: Lint
        run: luacheck .
      - name: Unit tests (stubbed WoW API)
        run: busted

  # A test build you can download from the Actions tab (not published anywhere).
  test-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Subversion (needed to fetch LibDBIcon)
        run: sudo apt-get update && sudo apt-get install -y subversion
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        with:
          args: -d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShortRoyalty-test-build
          # .release starts with a dot: upload-artifact skips "hidden" paths
          # unless told to (the build was made but nothing was uploaded).
          include-hidden-files: true
          if-no-files-found: error
          # Both paths share .release/, so the download contains a ready
          # "ShortRoyalty" folder (plus the zip the packager made).
          path: |
            .release/ShortRoyalty/
            .release/*.zip
