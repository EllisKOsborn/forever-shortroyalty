name: Discord bot

# Deploys Short Royalty's Discord bot (discord-bot/) to Cloudflare Workers
# (free plan) and registers its slash commands. Runs on a push to main that
# changes discord-bot/, or by hand: Actions tab → Discord bot → Run workflow.
# Setup (once) and the secrets it needs: docs/DISCORD-BOT.md. Until the
# secrets exist, it only runs the tests and says what's missing.
on:
  push:
    branches:
      - main
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot.yml"
  workflow_dispatch:

concurrency:
  group: discord-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      OFFICER_ROLES: ${{ vars.OFFICER_ROLES }}
      WRANGLER: npx --yes wrangler@4.160.0
      DB_NAME: shortroyalty-bot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Check the secrets
        id: secrets
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_APPLICATION_ID DISCORD_PUBLIC_KEY DISCORD_BOT_TOKEN; do
            if [ -z "${!s}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed. Missing secrets:$missing (see docs/DISCORD-BOT.md)"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Database (made the first time)
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            $WRANGLER d1 create "$DB_NAME"
            id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name===process.env.DB_NAME).uuid)})')
          fi
          sed -i "s/FILLED_IN_BY_THE_WORKFLOW/$id/" wrangler.toml
          $WRANGLER d1 migrations apply "$DB_NAME" --remote

      - name: Deploy
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          $WRANGLER deploy | tee deploy.log
          url=$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev address in the deploy output. Open Workers & Pages on the Cloudflare dashboard once to pick a workers.dev subdomain, then run this again."
            exit 1
          fi
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          printf '%s' "$DISCORD_PUBLIC_KEY" | $WRANGLER secret put DISCORD_PUBLIC_KEY
          printf '%s' "$DISCORD_BOT_TOKEN" | $WRANGLER secret put DISCORD_BOT_TOKEN
          printf '%s' "$DISCORD_APPLICATION_ID" | $WRANGLER secret put DISCORD_APPLICATION_ID
          if [ -n "$OFFICER_ROLES" ]; then printf '%s' "$OFFICER_ROLES" | $WRANGLER secret put OFFICER_ROLES; fi

      - name: Slash commands and Discord's link to the bot
        if: steps.secrets.outputs.ready == 'yes'
        run: npm run register
