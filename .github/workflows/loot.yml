# Reserve+ loot lists (v0.9.0): once a week, rebuild Data/Loot.lua from
# warcraft.wiki.gg and Forever's item data (tools/loot.js) and commit it to
# main if a raid's list changed (a new loot page, new items). Nothing is
# released by this: the next release (CHANGELOG heading dated, owner's
# "push to main") carries the new lists to players. Run it by hand from the
# Actions tab ("Loot lists" > Run workflow) after a Forever patch.
name: Loot lists

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# Write access only to commit Data/Loot.lua.
permissions:
  contents: write

concurrency:
  group: loot-lists
  cancel-in-progress: false

jobs:
  loot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rebuild Data/Loot.lua (warcraft.wiki.gg + Forever's item data)
        run: node tools/loot.js
      - name: Commit if a list changed
        run: |
          if git diff --quiet -- Data/Loot.lua; then
            echo "Loot lists unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Loot.lua
          git commit -m "Loot lists: update from warcraft.wiki.gg (tools/loot.js)"
          git push
